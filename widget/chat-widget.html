<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Chat Widget (n8n demo)</title>
<style>
  /* ====== CONFIG-STYLE THEME (edit colors freely) ====== */
  :root {
    --bot-bg: #2563eb;      /* bot bubble color */
    --bot-text: #ffffff;
    --user-bg: #e5e7eb;     /* user bubble color */
    --user-text: #111827;
    --panel-bg: #ffffff;
    --header-bg: #1e40af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #chat-panel {
    width: 100%; max-width: 380px; height: 520px; max-height: 80vh;
    margin: 0 auto; border: 1px solid #d1d5db; border-radius: 12px;
    display: flex; flex-direction: column; background: var(--panel-bg);
    overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,.12);
  }
  #chat-header {
    background: var(--header-bg); color: #fff; padding: 12px 16px;
    font-weight: 600; font-size: 15px;
  }
  #chat-header small { display: block; font-weight: 400; font-size: 12px; opacity: .85; }
  #chat-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.45; word-wrap: break-word; }
  .bot { align-self: flex-start; background: var(--bot-bg); color: var(--bot-text); border-bottom-left-radius: 4px; }
  .user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
  .typing { align-self: flex-start; background: var(--bot-bg); color: var(--bot-text); border-radius: 14px; border-bottom-left-radius: 4px; padding: 10px 14px; font-size: 14px; }
  .typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: #fff; opacity: .5; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
  #handoff-row { padding: 8px 12px; border-top: 1px dashed #e5e7eb; display: none; }
  #handoff-row button {
    width: 100%; padding: 9px; border: 1px solid var(--bot-bg); border-radius: 8px;
    background: #fff; color: var(--bot-bg); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #handoff-row button:hover { background: var(--bot-bg); color: #fff; }
  #chat-input-row { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5e7eb; }
  #chat-input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
  #chat-send { padding: 10px 16px; border: none; border-radius: 8px; background: var(--bot-bg); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  #chat-send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>

<div id="chat-panel">
  <div id="chat-header">
    💬 BrightSmile Dental Clinic
    <small>Demo assistant — replies may be automated</small>
  </div>
  <div id="chat-log" aria-live="polite"></div>
  <div id="handoff-row">
    <button id="handoff-btn" type="button">🙋 Talk to a human</button>
  </div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Ask a question…" autocomplete="off" maxlength="500">
    <button id="chat-send" type="button">Send</button>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG — edit these two values for your deployment
   ===================================================================== */
const WIDGET_WEBHOOK_URL = "REPLACE_WITH_YOUR_N8N_WEBHOOK_URL"; // e.g. https://your-n8n.app/webhook/chat
const HUMAN_CONTACT_MESSAGE = "Connecting you to our front desk… call us at (555) 123-4567 for urgent help.";
/* ===================================================================== */

const sessionId = "sess-" + Math.random().toString(36).slice(2, 10);
const log = document.getElementById("chat-log");
const input = document.getElementById("chat-input");
const sendBtn = document.getElementById("chat-send");
const handoffRow = document.getElementById("handoff-row");

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing-ind";
  div.innerHTML = "<span></span><span></span><span></span>";
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById("typing-ind");
  if (el) el.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendBtn.disabled = true;
  addMessage(text, "user");
  showTyping();

  try {
    const res = await fetch(WIDGET_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId })
    });
    const data = await res.json();
    hideTyping();
    addMessage(data.reply || "Sorry, something went wrong.", "bot");
    // Show the human-handoff button whenever the backend signals a handoff
    handoffRow.style.display = data.handoff ? "block" : "none";
  } catch (err) {
    hideTyping();
    addMessage("⚠️ Could not reach the assistant. Please try again or call (555) 123-4567.", "bot");
    handoffRow.style.display = "block";
  }
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

document.getElementById("handoff-btn").addEventListener("click", () => {
  addMessage("I'd like to talk to a human, please.", "user");
  addMessage(HUMAN_CONTACT_MESSAGE, "bot");
  handoffRow.style.display = "none";
});

// Greeting on load
addMessage("Hi! I'm the BrightSmile demo assistant. Ask me about hours, prices, or booking an appointment.", "bot");
</script>
</body>
</html>
